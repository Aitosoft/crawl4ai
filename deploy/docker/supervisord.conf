[supervisord]
nodaemon=true                   ; Run supervisord in the foreground
logfile=/dev/null               ; Log supervisord output to stdout/stderr
logfile_maxbytes=0

[program:redis]
; Loopback-only and password-protected. REDIS_PASSWORD is exported by
; entrypoint.sh from the mounted secret; the app must supply it to connect.
command=/usr/bin/redis-server --loglevel notice --bind 127.0.0.1 ::1 --requirepass "%(ENV_REDIS_PASSWORD)s" --dir /var/lib/redis
user=appuser                    ; Run redis as our non-root user
autorestart=true
priority=10
stdout_logfile=/dev/stdout      ; Redirect redis stdout to container stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr      ; Redirect redis stderr to container stderr
stderr_logfile_maxbytes=0

[program:gunicorn]
; Bind is resolved by entrypoint.sh into GUNICORN_BIND: loopback unless a
; credential (CRAWL4AI_API_TOKEN) is present, in which case the operator may
; expose 0.0.0.0. gunicorn is the authoritative socket-level guard; the Python
; _resolve_auth() check is the in-process guard - both must agree.
command=/usr/local/bin/gunicorn --bind "%(ENV_GUNICORN_BIND)s" --workers 1 --threads 4 --timeout 1800 --graceful-timeout 30 --keep-alive 300 --log-level info --limit-request-line 8190 --limit-request-fields 100 --worker-class uvicorn.workers.UvicornWorker aitosoft_entry:app
directory=/app                  ; Working directory for the app
user=appuser                    ; Run gunicorn as our non-root user
autorestart=true
priority=20
; RES_OPTIONS is glibc's per-process override for /etc/resolv.conf options, so
; it needs no root and no writable resolv.conf. Azure Container Apps injects a
; Kubernetes-style resolver -- 4 search domains + `options ndots:5`, read off a
; live replica 2026-08-05 -- and every outbound name we resolve is a customer
; FQDN, so ndots:5 costs 4 speculative NXDOMAIN lookups before each real one.
;
; Measured against that exact resolver config with a nameserver that receives
; and never answers: 22.75 s per getaddrinfo (8 UDP queries) as shipped, vs
; ~4 s at timeout:2 attempts:2 and 4 fewer queries at ndots:1. That matters
; twice: it bounds how long one dead nameserver can hold a resolver thread
; (egress_broker._resolve is blocking, and cancelling the request does NOT
; reclaim the thread), and it cuts DNS on the HAPPY path ~5x -- a page render
; performs 10-40 uncached resolves, one per TCP connection.
;
; Deliberately NOT timeout:1 attempts:1 (measured 2.00 s): any authoritative
; nameserver slower than 1 s would become gaierror -> EgressBlocked -> a hard
; failure for a healthy customer domain.
environment=PYTHONUNBUFFERED=1,RES_OPTIONS="timeout:2 attempts:2 ndots:1"
stdout_logfile=/dev/stdout      ; Redirect gunicorn stdout to container stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr      ; Redirect gunicorn stderr to container stderr
stderr_logfile_maxbytes=0

# Optional: Add filebeat or other logging agents here if needed