# Application Configuration
app:
  title: "Crawl4AI API"
  version: "1.0.0"
  # Loopback by default. Exposing on 0.0.0.0 requires a credential
  # (CRAWL4AI_API_TOKEN); the startup auth guard refuses an open non-loopback
  # bind without one. Put a TLS-terminating reverse proxy in front for exposure.
  host: "127.0.0.1"
  port: 11235
  reload: False
  workers: 1
  timeout_keep_alive: 300

# Default LLM Configuration
llm:
  provider: "openai/gpt-4o-mini"
  # api_key: sk-...  # If you pass the API key directly (not recommended)

# Redis Configuration
# Set task_ttl_seconds to automatically expire task data in Redis.
# This prevents unbounded memory growth from accumulated task results.
# Default: 3600 (1 hour). Set to 0 to disable TTL (not recommended).
# Can be overridden with REDIS_TASK_TTL environment variable.
redis:
  host: "localhost"
  port: 6379
  db: 0
  password: ""
  task_ttl_seconds: 3600  # TTL for task data (1 hour default)
  ssl: False
  ssl_cert_reqs: None
  ssl_ca_certs: None
  ssl_certfile: None
  ssl_keyfile: None

# Resource governance (DoS protection). Any limit set to 0 means "unbounded"
# (the pre-hardening behavior), so you can relax or disable each one.
limits:
  max_body_bytes: 10485760  # 10 MiB request body cap (413 if exceeded); 0 = unbounded
  max_pages: 100            # deep-crawl page budget clamp (defense in depth)
  max_depth: 5              # deep-crawl depth clamp
  # Aitosoft: 180s hard deadline per crawl (arun + patchright retry). Azure
  # Container Apps ingress times out at 240s; if the backend keeps running
  # past that, the pool slot leaks (2026-04-14 incident). 180s leaves ~60s
  # of margin for cleanup + serialization. Replaces our old api.py wait_for
  # patch — upstream v0.9.0 added this mechanism natively.
  wall_clock_s: 180         # per-crawl deadline in seconds (504 on timeout); 0 = no deadline
  queue:                    # background job queue for /crawl/job and /llm/job
    maxsize: 1000           # max queued jobs (503 when full); 0 = unbounded
    workers: 4              # concurrent background workers
    per_principal: 0        # max concurrent jobs per caller (429 over cap); 0 = unlimited

# Rate Limiting Configuration
rate_limiting:
  enabled: True
  default_limit: "1000/minute"
  trusted_proxies: []
  storage_uri: "memory://"  # Use "redis://localhost:6379" for production

# Security Configuration
# WARNING: For production deployments, enable security and use proper SECRET_KEY:
#   - Set jwt_enabled: true for authentication
#   - Set SECRET_KEY environment variable to a secure random value
#   - Set CRAWL4AI_HOOKS_ENABLED=true only if you need hooks (RCE risk)
security:
  enabled: true
  jwt_enabled: false
  api_token: ""  # When set, /token endpoint requires this secret to issue JWTs
  https_redirect: false
  trusted_hosts: ["*"]
  cors_allow_origins: []  # deny-by-default; list explicit origins to allow CORS
  headers:
    x_content_type_options: "nosniff"
    x_frame_options: "DENY"
    content_security_policy: "default-src 'self'"
    strict_transport_security: "max-age=63072000; includeSubDomains"

# Crawler Configuration
crawler:
  base_config:
    # Aitosoft 2026-08-09: `simulate_user: true` lived here and NEVER APPLIED.
    # api.py's base_config pass only fills a key whose current value is None or
    # "" — every CrawlerRunConfig boolean defaults to False, which is neither.
    # Diagnosed 2026-07-30, parked, and now commented out rather than left as a
    # line that reads like production behaviour. It is also a live landmine as
    # written: anyone "fixing" that merge rule would silently turn simulate_user
    # on for every request, which is an unmeasured behaviour change nobody has
    # asked for. If it is ever wanted, the working lever is
    # `CrawlerRunConfig.set_defaults(simulate_user=True)` in aitosoft_entry.py
    # (verified 2026-08-09) — not this file.
    #   simulate_user: true
    #
    # Aitosoft 2026-07-30: hard budget for the fetch phase of one arun() — all
    # anti-bot attempts and proxy retries share it. Without it a page that keeps
    # renavigating wedges an untimed Playwright call (page.content /
    # page.evaluate carry no protocol timeout) and burns the whole 180 s fence
    # in silence, returning a 504 with no diagnostic. See
    # tasks/render-retry-unbounded-hang.md.
    # Sized at ~fence/2 + margin: the second tier (patchright) runs a second
    # arun() inside the same fence, and only for results already judged blocked,
    # which by construction loaded fast. Must stay above the largest page_timeout
    # a client may send (MAS V14 sends 80 s) so one slow navigation still fits.
    # Applied by api.py's base_config pass; not client-settable (absent from
    # UNTRUSTED_FIELD_ALLOWLIST, so a client-sent value is dropped).
    total_timeout: 100000
  # Aitosoft 2026-08-01: capture wait for the patchright retry only
  # (tasks/challenge-interstitial-resolve.md phase 2). Measured offline over an
  # 84-cell grid: a capture wait W gets any challenge resolving within
  # W + 1.22 s, so MAS's production 2.0 covers ≤ 3.2 s and 10.0 covers ≤ 11.2 s.
  # Applied ONLY on the second-tier retry, which already runs for every detected
  # block — so it adds zero page loads, costs nothing on the happy path, and
  # runs inside the wall_clock_s fence. Do NOT raise the global
  # delay_before_return_html to get the same effect: at MAS's ~120,000-fetch
  # sweep that is ~267 render-hours, and blocked hosts pay it twice.
  retry_capture_wait_s: 10.0
  memory_threshold_percent: 85.0  # Aitosoft: was 95 — leave headroom on 4 GiB replicas
  rate_limiter:
    enabled: true
    base_delay: [1.0, 2.0]
  timeouts:
    stream_init: 30.0  # Timeout for stream initialization
    batch_process: 300.0  # Timeout for batch processing
  # Aitosoft: per-URL httpx timeout for render_mode "static". Deliberately
  # short — static mode is the fast/cheap alternative to Playwright, so
  # fetches should be fast or fail fast. Read once per process by
  # aitosoft_static_mode.py at client creation.
  static_fetch_timeout_s: 15
  pool:
    max_pages: 5                           # Aitosoft: keep low; scale horizontally via replicas (2026-04-14 starvation incident)
    # Aitosoft 2026-08-02 (tasks/pool-residency-unbounded.md): hard cap on LIVE
    # BROWSERS per replica, enforced by LRU eviction of idle ones in
    # crawler_pool.get_crawler. Before this, nothing bounded residency at all —
    # max_pages bounds pages per browser and render_capacity bounds concurrent
    # renders, but the browser count tracked DISTINCT browser_config SIGNATURES
    # seen in the last TTL window. Measured peak on 2026-07-31: 9-10 per replica.
    #
    # WHY A CAP EXISTS AT ALL — this argument does not involve memory, which is
    # the point. Pool residency is driven by client-supplied cardinality, and
    # cardinality is not bounded by anything we control:
    #   - `user_agent_mode` is in UNTRUSTED_FIELD_ALLOWLIST
    #     (crawl4ai/async_configs.py:227), so any client may send it;
    #   - `"random"` regenerates the UA in BrowserConfig.__init__ (:901), and
    #     `user_agent` is part of the pool signature;
    #   - our own shipped client doc recommends it (c4ai-doc-context.md:167).
    # Verified: 8 identical `user_agent_mode: "random"` configs produce 5
    # distinct pool signatures; 8 identical fixed-UA configs produce 1. Under
    # that one word the pool becomes write-only — one Chromium launch per
    # request, evicted by nothing. The cap is what makes that survivable.
    #
    # HOW 6 WAS SIZED: 6 = 3x render_capacity. The render gate admits at most
    # `render_capacity` concurrent renders holding one pool browser each, so at
    # 3x there are always >= 2x render_capacity idle eviction candidates and the
    # refusal branch is unreachable through /crawl. **Keep this ratio if
    # render_capacity moves.** 6 is below the observed 10-12 signature working
    # set, so it will cause extra launches (~1-3 s each, on the unfenced part of
    # the admission path). That cost is real and accepted.
    #
    # The memory argument for a cap is real but NOT settled — the regression
    # this comment used to derive 6 from is disputed on three counts, all
    # biasing browsers down (tasks/replica-memory-baseline-unexplained.md,
    # "Why the fit is not settled"). Do not re-derive this number from a
    # per-browser MB figure or an intercept without reading that first. The cap
    # bounds a real term under every candidate slope; it is not the fix for the
    # memory guard firing.
    max_browsers: 6
    evict_close_timeout_sec: 30           # bound on an evicted browser's close(), off-lock
    idle_ttl_sec: 300                     # 30 min janitor cutoff
    stuck_busy_timeout_sec: 600           # Aitosoft: janitor force-closes browsers busy longer than this (leak safety net)
    # Aitosoft 2026-08-02: how long the boot ("permanent") browser may sit
    # unused before the janitor closes it. Was the code default of 600 s;
    # lowered because that browser is unreachable BY CONSTRUCTION, not by
    # chance: server.py:199 builds its BrowserConfig inline WITHOUT
    # enforce_egress, while get_default_browser_config():138 and every request
    # path apply it — so its signature differs from any request's in
    # `ignore_https_errors` and can never be matched. Confirmed in production:
    # 0 permanent hits in 224 pool gets (2026-07-31).
    #
    # At 600 s it therefore held ~140 MB through minutes 0-10 of a replica's
    # life, which is exactly the cold-burst window that produced all nine of
    # MAS's memory refusals (replica up 04:44:49, refusals 04:46-04:50). 120 s
    # is a couple of janitor ticks plus margin, and costs nothing if the
    # signature mismatch is ever fixed: get_crawler lazily re-creates the
    # permanent browser when a default-config request actually arrives
    # (pinned by test_permanent_reinit_after_stuck_force_close).
    #
    # NOT the real fix. Whether that boot browser should exist at all —
    # delete the init_permanent call, or make it reachable by routing it
    # through get_default_browser_config() — is a server.py change and its own
    # decision. See tasks/pool-residency-unbounded.md.
    permanent_unused_ttl_sec: 120
    # Aitosoft render admission (2026-07-17, kynnos.fi 504 incident). Hard cap
    # on concurrent /crawl full renders per replica; overflow queues briefly,
    # then 429s so the client retries against a scaled-out replica instead of
    # contending into the 180s wall-clock fence. See aitosoft_admission.py +
    # tasks/capacity-scaling-redesign-2026-07-17.md.
    #
    # THIS NUMBER IS *NOT* THE ACA SCALE RULE, and this comment used to say it
    # "MUST match" it. That was a category error, corrected 2026-08-08:
    #
    #   render_capacity   = concurrent renders one replica will run at once.
    #                       A hard cap. Cannot be exceeded. THIS is the safety
    #                       mechanism, and it is enforced in-process.
    #   ACA concurrentRequests = the autoscaler's TRIGGER. It decides only when
    #                       Azure adds a replica. It protects nothing, and it is
    #                       not even in the same units -- Microsoft's own doc
    #                       defines it as "requests in the past 15 seconds
    #                       divided by 15", which is a RATE, while labelling it
    #                       concurrency. Two numbers in different units can
    #                       never meaningfully be "equal".
    #
    # Pinning them together is what produced the over-provisioning in
    # tasks/autoscaler-ratchets-to-the-cap.md: on 2026-08-08 MAS's segment 3
    # ran the whole 30-minute window at maxReplicas (30) on a workload whose
    # mean concurrency was 1.24 and whose peak in-flight was 8 -- 44x
    # over-provisioned measured in replica-minutes, ~2.3% efficiency.
    #
    # Setting the trigger ABOVE render_capacity cannot oversubscribe a replica:
    # the gate still admits only `render_capacity` renders and queues
    # `admission_queue` more. The trigger only decides how eagerly Azure adds
    # capacity. Live value is 6 (ACA's own default is 10; we were at 2).
    # deploy-image.sh verifies the live rule against ACA_SCALE_TRIGGER there,
    # which is the single source of truth for the deploy-time contract.
    render_capacity: 2                    # concurrent renders admitted per replica
    admission_queue: 4                    # max waiters; more than this -> instant 429
    admission_max_wait_s: 15              # max queue wait before 429 (fence starts AFTER dequeue)
  browser:
    # Aitosoft stealth defaults (2026-04-11 stealth package). Applied to every
    # request via BrowserConfig.set_defaults() in aitosoft_entry.py.
    kwargs:
      headless: true
      text_mode: false                     # Load images/fonts — blocking them is a clean fingerprint signal
      enable_stealth: true                 # playwright-stealth: patches navigator.webdriver, chrome.runtime, WebGL vendor, plugins
      chrome_channel: chrome               # Real Google Chrome (installed in Dockerfile); browser_manager reads chrome_channel at launch
      channel: chrome                      # Kept for symmetry — BrowserConfig stores both
      viewport_width: 1920                 # Realistic desktop (default 1080 is unusually narrow)
      viewport_height: 1080                # Realistic desktop (default 600 is unusually short)
      user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"  # Windows to match playwright-stealth's navigator.platform=Win32 override; version tracks current stable Chrome — bump on rebuild
    extra_args:
      # - "--single-process"
      # SECURITY: --no-sandbox disables the Chromium renderer sandbox (a renderer
      # exploit can then reach the container). It is required only because the
      # container runs as non-root without a usable sandbox. To remove it, run
      # the container with an unprivileged user namespace
      # (host: unprivileged_userns_clone=1) OR a verified seccomp profile
      # (compose: security_opt: seccomp=...), then delete this flag and confirm
      # Chromium still starts. Tracked as a build-gated hardening item.
      - "--no-sandbox"
      - "--disable-dev-shm-usage"
      # Aitosoft: NO --disable-gpu / --disable-software-rasterizer here — they
      # kill WebGL, one of the loudest anti-bot signals (stealth package).
      # browser_manager gates them on enable_stealth.
      # --disable-web-security removed for security (enables cross-origin access)
      # --ignore-certificate-errors not needed here: upstream browser_manager
      # already hardcodes it into every Chromium launch (build_browser_flags +
      # _build_browser_args), so cert validation is off process-wide and
      # broken-cert SME sites crawl in full mode. Verified live 2026-07-17
      # (expired.badssl.com downloads in full mode; see
      # tasks/tls-broken-cert-regression.md). Note this also makes
      # enforce_egress's ignore_https_errors=False forcing moot — if upstream
      # ever drops those launch flags, TLS verification silently turns ON and
      # CRAWL4AI_ALLOW_INSECURE_TLS=true becomes necessary.

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Observability Configuration
observability:
  prometheus:
    enabled: True
    endpoint: "/metrics"
  health_check:
    endpoint: "/health"

# Webhook Configuration
webhooks:
  enabled: true
  default_url: null  # Optional: default webhook URL for all jobs
  data_in_payload: false  # Optional: default behavior for including data
  retry:
    max_attempts: 5
    initial_delay_ms: 1000  # 1s, 2s, 4s, 8s, 16s exponential backoff
    max_delay_ms: 32000
    timeout_ms: 30000  # 30s timeout per webhook call
  headers:  # Optional: default headers to include
    User-Agent: "Crawl4AI-Webhook/1.0"